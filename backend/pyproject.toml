[project]
name = "skynex-backend"
version = "0.1.0"
description = "Enterprise Cloud Security Investigation Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "iam-intelligence-engine",
    "terraform-security-analyzer",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv.sources]
iam-intelligence-engine = { path = "../../../Engineering-Portfolio/iam-intelligence-engine", editable = true }
terraform-security-analyzer = { path = "../../../terraform-security-analyzer", editable = true }
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
